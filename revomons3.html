<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revomons - Item Catalog & Values</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1e1e1e; }
        .rev-dark { background-color: #2a2a2a; }
        .rev-header { background-color: #333333; }
        .rev-border { border-color: #3f3f3f; }
    </style>
</head>
<body class="text-zinc-200 min-h-screen font-sans antialiased transition-colors duration-300">

    <nav class="bg-[#262626] border-b-2 border-zinc-400 px-6 py-2 flex items-center justify-between shadow-lg relative z-10">
        <div class="flex items-center gap-3">
            <div class="flex items-center cursor-pointer active:scale-95 transition-transform duration-100" onclick="goHome()">
                <img src="1000057936.png" alt="Revomons Logo" class="h-8 w-auto object-contain">
            </div>
            <div class="hidden md:flex gap-4 text-xs font-bold text-zinc-400 uppercase tracking-wider ml-6">
                <a href="#" onclick="goHome(); return false;" class="text-white border-b border-zinc-300 pb-1 transition-all duration-200">Item Values</a>
                <a href="#" class="hover:text-zinc-200 transition-colors duration-200">Deals</a>
                <a href="#" class="hover:text-zinc-200 transition-colors duration-200">Leaderboards</a>
            </div>
        </div>
        <div class="text-xs font-mono bg-[#161616] px-3 py-1 rounded text-zinc-400 border border-zinc-800">
            Items Tracked: <span id="itemCount" class="text-zinc-300 font-bold">0</span>
        </div>
    </nav>

    <div id="catalogSection" class="transition-all duration-300 ease-in-out transform">
        <header class="max-w-7xl mx-auto px-4 pt-6">
            <div class="bg-[#262626] border border-zinc-800 p-4 rounded flex flex-col sm:flex-row gap-4 items-center justify-between shadow-md">
                <h1 class="text-sm font-black uppercase text-zinc-400 tracking-wider">📈 Item Registry</h1>
                <input type="text" id="searchBar" placeholder="Search catalog by name or acronym..." 
                       class="w-full sm:w-80 bg-[#161616] border rev-border rounded px-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all duration-200">
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4">
            <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                </div>
        </main>
    </div>

    <div id="detailSection" class="hidden max-w-5xl mx-auto p-4 pt-6 transition-all duration-300 ease-in-out transform translate-y-4 opacity-0">
        <button onclick="goHome()" class="mb-4 text-xs font-bold uppercase tracking-wider text-zinc-400 hover:text-white transition-all duration-200 flex items-center gap-1 cursor-pointer hover:-translate-x-1">
            ← Back to Item Values
        </button>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <div class="md:col-span-1 rev-dark border rev-border rounded p-4 flex flex-col items-center justify-center shadow-lg">
                <div class="w-full bg-[#161616] border rev-border rounded-lg aspect-square flex items-center justify-center mb-4 p-4 shadow-inner group">
                    <div id="itemPageAcronymImg" class="text-4xl font-mono font-black tracking-tight text-zinc-600 uppercase select-none group-hover:scale-110 transition-transform duration-300"></div>
                </div>
                <h2 id="itemPageName" class="text-lg font-black text-white text-center leading-tight">Item Name</h2>
                <span id="itemPageAcronym" class="mt-1 font-mono text-xs px-2 py-0.5 bg-[#161616] border rev-border text-zinc-400 rounded uppercase"></span>
            </div>

            <div class="md:col-span-2 space-y-4">
                
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-[#262626] border border-zinc-800 p-3 rounded shadow text-center">
                        <div class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Item Value</div>
                        <div id="itemPageValue" class="text-sm font-mono font-black text-zinc-200 mt-1"></div>
                    </div>
                    <div class="bg-[#262626] border border-zinc-800 p-3 rounded shadow text-center">
                        <div class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Market Demand</div>
                        <div id="itemPageDemand" class="text-sm font-mono font-bold text-zinc-300 mt-1"></div>
                    </div>
                    <div class="bg-[#262626] border border-zinc-800 p-3 rounded shadow text-center">
                        <div class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Economy Trend</div>
                        <div id="itemPageTrend" class="text-sm font-mono font-bold text-zinc-300 mt-1"></div>
                    </div>
                </div>

                <div class="rev-dark border rev-border rounded p-4 shadow-lg">
                    <h3 class="text-xs uppercase font-extrabold tracking-widest text-zinc-400 border-b rev-border pb-2 mb-3">Value History Chart</h3>
                    <div class="bg-[#161616] border rev-border p-2 rounded-lg relative h-64 w-full">
                        <canvas id="valueChart"></canvas>
                    </div>
                </div>

                <div class="rev-dark border rev-border rounded p-5 shadow-lg">
                    <h3 class="text-xs uppercase font-extrabold tracking-widest text-zinc-400 border-b rev-border pb-2 mb-3">Item Biography & Market Analysis</h3>
                    <p id="itemPageReason" class="text-xs text-zinc-300 leading-relaxed font-sans bg-[#161616] border rev-border p-4 rounded-lg shadow-inner">
                        </p>
                </div>

                <div class="bg-zinc-900/30 border border-zinc-800/80 p-3 rounded flex items-center justify-between text-[11px] font-mono text-zinc-500">
                    <div>Asset Category: <span class="text-zinc-400">Arcane Booster Set</span></div>
                    <div class="text-red-400/80 font-bold uppercase tracking-widest animate-pulse">⚠️ Distribution Locked</div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-12 text-xs text-zinc-600 font-mono tracking-tight">
        © 2026 Revomons
    </footer>

    <script>
        let chartInstance = null;

        // this is your main item database array. to add a new item, just copy an existing row and change the text inside it.
        const itemsList = [
            { 
                name: "Arcane Assassin's Mask", 
                acronym: "AAS", 
                value: "Priceless", 
                demand: "High", 
                trend: "Stable", 
                reason: "Boosters item, Untradeable, basically Priceless.",
                history: [0, 0, 0, 0, 0]
            },
            { 
                name: "Arcane 360", 
                acronym: "A360", 
                value: "Priceless", 
                demand: "High", 
                trend: "Stable", 
                reason: "Boosters item, Untradeable, basically Priceless.",
                history: [0, 0, 0, 0, 0] 
            },
            { 
                name: "Lord of the Arcaneration", 
                acronym: "LOTA", 
                value: "Priceless", 
                demand: "High", 
                trend: "Stable", 
                reason: "Boosters item, Untradeable, basically Priceless.",
                history: [0, 0, 0, 0, 0]
            },
            { 
                name: "Arcane Fedora", 
                acronym: "AF", 
                value: "Priceless", 
                demand: "High", 
                trend: "Stable", 
                reason: "Boosters item, Untradeable, basically Priceless.",
                history: [0, 0, 0, 0, 0]
            },
            { 
                name: "Arcane Domino Crown", 
                acronym: "ADC", 
                value: "Priceless", 
                demand: "High", 
                trend: "Stable", 
                reason: "Boosters item, Untradeable, basically Priceless.",
                history: [0, 0, 0, 0, 0]
            }
        ];

        // dynamic card generator for the catalog frontpage grid
        function renderCatalog(filteredItems) {
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = "";
            if (filteredItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-xs font-mono text-zinc-500">No matching items indexed.</div>`;
                return;
            }
            filteredItems.forEach((item) => {
                grid.innerHTML += `
                    <div onclick="navigateToItem('${item.acronym}')" 
                         class="rev-dark border rev-border rounded shadow flex flex-col justify-between overflow-hidden cursor-pointer transform hover:-translate-y-1 hover:scale-[1.02] hover:border-zinc-400 hover:shadow-xl transition-all duration-300 ease-out group">
                        <div class="rev-header px-3 py-1.5 border-b rev-border text-center font-bold text-xs text-zinc-400 group-hover:text-white group-hover:bg-[#3d3d3d] transition-all duration-200 truncate">
                            ${item.name}
                        </div>
                        <div class="p-3 flex items-center justify-between gap-2 bg-[#222]/10">
                            <div class="w-14 h-14 bg-[#1a1a1a] rounded border rev-border flex items-center justify-center text-zinc-500 font-mono text-[10px] font-bold uppercase group-hover:border-zinc-500 transition-colors duration-300">
                                ${item.acronym}
                            </div>
                            <div class="flex-1 text-right space-y-0.5 font-mono text-xs">
                                <div class="flex justify-between text-zinc-500 pl-4"><span>Value:</span> <span class="text-zinc-300 font-bold">${item.value}</span></div>
                                <div class="flex justify-between text-zinc-500 pl-4"><span>Demand:</span> <span class="text-zinc-400">${item.demand}</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // line graph chart constructor using chartjs scale settings
        function buildGraph(itemHistoryData) {
            const ctx = document.getElementById('valueChart').getContext('2d');
            if (chartInstance) { chartInstance.destroy(); }
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Feb 2026', 'Mar 2026', 'Apr 2026', 'May 2026', 'Jun 2026'],
                    datasets: [{
                        label: 'Value Trend',
                        data: itemHistoryData,
                        borderColor: '#a1a1aa',
                        backgroundColor: 'rgba(161, 161, 170, 0.05)',
                        borderWidth: 2,
                        tension: 0.2,
                        pointBackgroundColor: '#ffffff',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#27272a' }, ticks: { color: '#71717a', font: { family: 'monospace', size: 10 } } },
                        y: { grid: { color: '#27272a' }, ticks: { color: '#71717a', font: { family: 'monospace', size: 10 } } }
                    }
                }
            });
        }

        // updates the address parameter tag (?item=xyz) when an item gets selected
        function navigateToItem(acronym) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?item=' + acronym;
            window.history.pushState({ path: newUrl }, '', newUrl);
            checkRouting();
        }

        // clears query flags out of URL to drop back to main site feed
        function goHome() {
            const clearUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({ path: clearUrl }, '', clearUrl);
            checkRouting();
        }

        // custom dynamic page router to cycle interfaces based on the link bar parameters
        function checkRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemQuery = urlParams.get('item');
            const catalogSec = document.getElementById("catalogSection");
            const detailSec = document.getElementById("detailSection");

            if (itemQuery) {
                const foundItem = itemsList.find(i => i.acronym.toLowerCase() === itemQuery.toLowerCase());
                
                if (foundItem) {
                    document.getElementById("itemPageName").innerText = foundItem.name;
                    document.getElementById("itemPageAcronym").innerText = foundItem.acronym;
                    document.getElementById("itemPageAcronymImg").innerText = foundItem.acronym;
                    document.getElementById("itemPageValue").innerText = foundItem.value;
                    document.getElementById("itemPageDemand").innerText = foundItem.demand;
                    document.getElementById("itemPageTrend").innerText = foundItem.trend;
                    document.getElementById("itemPageReason").innerText = foundItem.reason;

                    catalogSec.classList.add("opacity-0", "-translate-y-4");
                    setTimeout(() => {
                        catalogSec.classList.add("hidden");
                        detailSec.classList.remove("hidden");
                        setTimeout(() => {
                            detailSec.classList.remove("opacity-0", "translate-y-4");
                            buildGraph(foundItem.history);
                        }, 50);
                    }, 200);
                    window.scrollTo(0, 0);
                    return;
                }
            }

            detailSec.classList.add("opacity-0", "translate-y-4");
            setTimeout(() => {
                detailSec.classList.add("hidden");
                catalogSec.classList.remove("hidden");
                setTimeout(() => { catalogSec.classList.remove("opacity-0", "-translate-y-4"); }, 50);
            }, 200);
        }

        // dynamic live search filter calculations
        document.getElementById("searchBar").addEventListener("input", (e) => {
            const searchString = e.target.value.toLowerCase();
            const matchingItems = itemsList.filter(item => 
                item.name.toLowerCase().includes(searchString) || item.acronym.toLowerCase().includes(searchString)
            );
            renderCatalog(matchingItems);
        });

        // hooks into web browser back and forward mouse commands cleanly
        window.addEventListener('popstate', checkRouting);
        
        // system kickstarter runs on fresh loads
        document.getElementById("itemCount").innerText = itemsList.length;
        renderCatalog(itemsList);
        checkRouting();
    </script>
</body>
</html>
