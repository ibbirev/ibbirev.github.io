<!DOCTYPE html>

<head>

    <title>Revomons Forums</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #1e1e1e; color: #e4e4e7; }
        .rev-dark { background-color: #2a2a2a; }

        </div>
        <div class="text-xs font-mono bg-[#161616] px-3 py-1 rounded border border-zinc-700">

    <script>
        const SUPABASE_URL = "https://uuhtviecltmgsaaoinyy.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1aHR2aWVjbHRtZ3NhYW9pbnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDgwODgsImV4cCI6MjA5ODIyNDA4OH0.DfM0PTYgdpRg3F6UjrgOuBIDZTKp_cuv1ZJKESVTz2Q";

            `).join("");
        }

        init();
