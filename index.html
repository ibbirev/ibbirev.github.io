<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revomons Forums</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1e1e1e; }
        .rev-dark { background-color: #2a2a2a; }
        .rev-header { background-color: #333333; }
        .rev-border { border-color: #3f3f3f; }
    </style>
</head>
<body class="text-zinc-200 min-h-screen font-sans antialiased transition-colors duration-300">

    <nav class="bg-[#262626] border-b-2 border-zinc-400 px-6 py-2 flex items-center justify-between shadow-lg relative z-10">
        <div class="flex items-center gap-3">
            <div class="flex items-center cursor-pointer active:scale-95 transition-transform duration-100" onclick="goHome()">
                <img src="image.png" alt="Revomons Logo" class="h-8 w-auto object-contain">
            </div>
            <div class="hidden md:flex gap-4 text-xs font-bold text-zinc-400 uppercase tracking-wider ml-6">
                <a href="#" onclick="goHome(); return false;" class="text-white border-b border-zinc-300 pb-1 transition-all duration-200">Item Values</a>
                <a href="#marketplaceForum" class="hover:text-zinc-200 transition-colors duration-200">💬 Trading Forums</a>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-xs font-mono bg-[#161616] px-3 py-1 rounded text-zinc-400 border border-zinc-800">
                Items Tracked: <span id="itemCount" class="text-zinc-300 font-bold">0</span>
            </div>
        </div>
    </nav>

    <div id="catalogSection" class="transition-all duration-300 ease-in-out transform">
        <header class="max-w-7xl mx-auto px-4 pt-6">
            <div class="bg-[#262626] border border-zinc-800 p-4 rounded flex flex-col sm:flex-row gap-4 items-center justify-between shadow-md">
                <h1 class="text-sm font-black uppercase text-zinc-400 tracking-wider">📈 Item Registry</h1>
                <input type="text" id="searchBar" placeholder="Search catalog by name..." class="w-full sm:w-80 bg-[#161616] border rev-border rounded px-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all duration-200">
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4">
            <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </main>
        <section id="marketplaceForum" class="max-w-7xl mx-auto px-4 py-8 scroll-mt-6">
            <div class="border-t rev-border pt-6">
                <div class="bg-[#262626] border border-zinc-800 rounded-lg p-6 shadow-xl">
                    <div id="revsimLockCard" class="bg-[#1a1a1a] p-6 rounded border rev-border text-center flex flex-col items-center justify-center min-h-[300px]">
                        <input type="text" id="discordUsernameInput" placeholder="Discord Username" class="w-full max-w-xs bg-[#262626] border rev-border rounded px-3 py-2 text-xs text-zinc-200 mb-2 text-center font-mono">
                        <input type="password" id="discordPasskeyInput" placeholder="Passkey" class="w-full max-w-xs bg-[#262626] border rev-border rounded px-3 py-2 text-xs text-zinc-200 mb-2 text-center font-mono">
                        <button onclick="verifyDiscordCredentials()" class="w-full max-w-xs bg-zinc-200 hover:bg-white text-zinc-900 text-xs font-bold uppercase px-4 py-2 rounded">Access Hub</button>
                    </div>
                    <div id="revsimChatCard" class="hidden space-y-4">
                        <div class="bg-[#1a1a1a] p-4 rounded border rev-border max-h-64 overflow-y-auto font-mono text-xs" id="chatLogsContainer"></div>
                        <div class="flex gap-2">
                            <input type="text" id="chatMessageInput" placeholder="Post trade..." class="flex-1 bg-[#121212] border rev-border rounded px-3 py-2 text-xs text-zinc-200">
                            <button onclick="submitNativeMessage()" class="bg-zinc-300 text-zinc-950 font-black text-xs uppercase px-4 py-2 rounded">Post</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="detailSection" class="hidden max-w-5xl mx-auto p-4 pt-6">
        <button onclick="goHome()" class="text-xs font-bold text-zinc-400">← Back</button>
        <div id="itemDetailContent" class="mt-6">
            <h2 id="itemPageName" class="text-2xl font-black"></h2>
            <div id="itemPageValue" class="text-zinc-400"></div>
            <canvas id="valueChart" class="mt-4"></canvas>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uuhtviecltmgsaaoinyy.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allItems = [];

        async function fetchCatalog() {
            const { data, error } = await supabase.from('items').select('*');
            if (error) { console.error(error); return; }
            allItems = data || [];
            document.getElementById("itemCount").innerText = allItems.length;
            renderCatalog(allItems);
        }

        function renderCatalog(items) {
            document.getElementById("catalogGrid").innerHTML = items.map(item => `
                <div onclick="navigateToItem('${item.name}')" class="rev-dark border rev-border rounded p-4 cursor-pointer hover:border-zinc-400">
                    <div class="font-bold text-sm text-zinc-300 truncate">${item.name}</div>
                    <div class="text-xs text-zinc-500 mt-2">Value: ${item.value}</div>
                </div>
            `).join("");
        }

        function navigateToItem(name) {
            const item = allItems.find(i => i.name === name);
            if (!item) return;
            document.getElementById("itemPageName").innerText = item.name;
            document.getElementById("itemPageValue").innerText = "Value: " + item.value;
            document.getElementById("catalogSection").classList.add("hidden");
            document.getElementById("detailSection").classList.remove("hidden");
        }

        function goHome() {
            document.getElementById("detailSection").classList.add("hidden");
            document.getElementById("catalogSection").classList.remove("hidden");
        }

        // --- AUTH & CHAT LOGIC ---
        async function verifyDiscordCredentials() {
            const user = document.getElementById("discordUsernameInput").value.toLowerCase();
            const key = document.getElementById("discordPasskeyInput").value;
            const { data, error } = await supabase.from('whitelist').select('*').eq('username', user).eq('passkey', key);
            
            if (data && data.length > 0) {
                document.getElementById("revsimLockCard").classList.add("hidden");
                document.getElementById("revsimChatCard").classList.remove("hidden");
            } else {
                alert("Access Denied");
            }
        }

        async function submitNativeMessage() {
            const text = document.getElementById("chatMessageInput").value;
            await supabase.from('market_chats').insert([{ sender: 'User', text: text }]);
            document.getElementById("chatMessageInput").value = "";
        }

        fetchCatalog();
    </script>
</body>
</html>
