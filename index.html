<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revomons Forums</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1e1e1e; }
        .rev-dark { background-color: #2a2a2a; }
        .rev-header { background-color: #333333; }
        .rev-border { border-color: #3f3f3f; }
    </style>
</head>
<body class="text-zinc-200 min-h-screen font-sans antialiased transition-colors duration-300">

    <nav class="bg-[#262626] border-b-2 border-zinc-400 px-6 py-2 flex items-center justify-between shadow-lg relative z-10">
        <div class="flex items-center gap-3">
            <div class="flex items-center cursor-pointer active:scale-95 transition-transform duration-100" onclick="goHome()">
                <img src="image.png" alt="Revomons Logo" class="h-8 w-auto object-contain">
            </div>
            <div class="hidden md:flex gap-4 text-xs font-bold text-zinc-400 uppercase tracking-wider ml-6">
                <a href="#" onclick="goHome(); return false;" class="text-white border-b border-zinc-300 pb-1 transition-all duration-200">Item Values</a>
                <a href="#marketplaceForum" class="hover:text-zinc-200 transition-colors duration-200">💬 Trading Forums</a>
            </div>
        </div>
        <div class="text-xs font-mono bg-[#161616] px-3 py-1 rounded text-zinc-400 border border-zinc-800">
            Items Tracked: <span id="itemCount" class="text-zinc-300 font-bold">0</span>
        </div>
    </nav>

    <div id="catalogSection" class="transition-all duration-300 ease-in-out transform">
        <main class="max-w-7xl mx-auto p-4">
            <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://uuhtviecltmgsaaoinyy.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allItems = [];

        // 1. Fetch live data from Supabase
        async function fetchCatalog() {
            const { data, error } = await supabase.from('items').select('*');
            if (error) { console.error("Database Error:", error); return; }
            allItems = data || [];
            document.getElementById("itemCount").innerText = allItems.length;
            renderCatalog(allItems);
        }

        // 2. Updated render function
        function renderCatalog(items) {
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = items.map(item => `
                <div class="rev-dark border rev-border rounded p-4 shadow flex flex-col justify-between">
                    <div class="font-bold text-sm text-zinc-300 truncate">${item.name}</div>
                    <div class="text-xs text-zinc-500 mt-2">Value: ${item.value}</div>
                </div>
            `).join("");
        }

        // Initialize the app
        fetchCatalog();
        
        // ... (Include your existing goHome, verifyDiscordCredentials, etc. functions below)
    </script>
</body>
</html>
